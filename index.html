<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>碑刻字阵切分</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"PingFang SC",sans-serif;color:#222;background:#f5f3ef}header{padding:18px 24px;background:#252321;color:#fff}h1{margin:0;font-size:21px}header p{margin:4px 0 0;color:#d9d4ca}.app{display:grid;grid-template-columns:minmax(460px,1fr) 360px;gap:16px;padding:16px;max-width:1500px;margin:auto}.panel{background:#fff;border:1px solid #ddd6cc;border-radius:8px;padding:14px}.canvas-wrap{height:calc(100vh - 150px);min-height:560px;overflow:auto;background:#262626;border-radius:5px}.canvas-wrap.dragover{outline:3px dashed #ffcf4a;outline-offset:-7px}.canvas-wrap canvas{display:block;transform-origin:0 0}label{display:block;margin:9px 0 3px;font-weight:600}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:7px;border:1px solid #bbb;border-radius:4px}button{padding:7px 10px;border:1px solid #948b80;border-radius:4px;background:#f8f5ef;cursor:pointer}button.primary{background:#7d3f24;color:white;border-color:#7d3f24}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0;flex:1}.compact>*{flex:0 0 auto}.compact input{width:75px}.help,.status{color:#665f57;font-size:12px}.status{min-height:20px;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chars{max-height:290px;overflow:auto;margin-top:8px;border:1px solid #ddd;border-radius:4px}.chars table{width:100%;border-collapse:collapse}.chars td,.chars th{padding:4px;border-bottom:1px solid #eee;text-align:left}.chars input{padding:4px}.missing input{border-color:#bd473b;background:#fff5f3}.section{border-top:1px solid #e6e1d9;margin-top:14px;padding-top:10px}.hidden{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.canvas-wrap{height:60vh}}
</style>
<header><h1>碑刻字阵切分</h1><p>导入字阵 → 调整旋转和网格 → 填写字头 → 导出 PNG 与清单</p></header>
<main class="app"><section class="panel"><div class="canvas-wrap" id="canvasWrap"><canvas id="canvas"></canvas></div><p class="help">先旋转图片，再直接拖动：四角缩放网格，外边框移动网格，内部线调整整条分割线；按 Alt/Option 拖内部线可单独调整当前段。按住非控制区域可平移查看，网格随底图一起移动。黄色高亮表示当前命中。滚轮和“适应窗口”只改变查看大小，不改变相对位置或输出。</p></section>
<aside class="panel"><label for="file">字阵图片（PNG / JPEG / WebP）</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp">
<div class="grid"><div><label for="rows">行</label><input id="rows" type="number" min="1" max="30" step="1" value="3"></div><div><label for="cols">列</label><input id="cols" type="number" min="1" max="30" step="1" value="3"></div></div><button id="resetGrid">按当前行列重置网格</button>
<div class="section"><label for="angle">旋转（度）</label><div class="row"><input id="angleRange" aria-label="旋转滑杆" type="range" min="-15" max="15" step="0.1" value="0"><input id="angle" type="number" min="-15" max="15" step="0.1" value="0"></div><div class="row compact"><button data-angle="-0.1">−0.1°</button><button data-angle="0.1">+0.1°</button><button data-angle="0">归零</button></div></div>
<div class="section"><button id="fit">适应窗口</button></div>
<div class="section"><label for="direction">填充顺序</label><select id="direction"><option value="vertical">传统竖排：右→左，每列上→下</option><option value="horizontal">横排：左→右，每行上→下</option></select><label for="paste">批量粘贴字头</label><textarea id="paste" rows="2" placeholder="粘贴后点击填入；忽略空白"></textarea><button id="fill">按顺序填入</button><div class="chars"><table><thead><tr><th>格</th><th>字头</th></tr></thead><tbody id="charRows"></tbody></table></div></div>
<div class="section"><label for="title">书名</label><input id="title"><label for="book">书名简称</label><input id="book"><label for="page">页码</label><input id="page"><label for="note">说明（可选）</label><input id="note"><label for="template">命名模板</label><input id="template" value="{char}_{page}_{book}"><p class="help">变量：{char} {page} {book} {row} {col} {seq} {note} {size}</p><label for="sizes">分辨率</label><input id="sizes" value="original,256,512"><label for="background">补边背景</label><select id="background"><option value="black">黑色</option><option value="white">白色</option></select><button id="export" class="primary">选择目录并导出</button><div id="status" class="status" role="status"></div></div>
</aside></main><script src="./core.js"></script><script src="./app.js"></script></html>
